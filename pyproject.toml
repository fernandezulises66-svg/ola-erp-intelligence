[project]
name = "ola-erp-intelligence"
version = "1.0.0"
description = "Sistema de IA de grado de producción: RAG híbrido + agentes con supervisor + API FastAPI + trazas en Arize Phoenix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "redis==8.1.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-redis==0.6.0",
    "langchain-core==1.7.6",
    "langchain-anthropic==1.7.10",
    "langchain-openai==1.7.4",
    "langchain-text-splitters==1.1.3",
    "pinecone[asyncio]==7.3.0",
    "rank-bm25==0.2.2",
    "snowballstemmer==3.1.1",
    "tiktoken==0.14.0",
    "pypdf==7.0.0",
    "PyYAML==6.0.3",
    "arize-phoenix-otel==0.17.3",
    "openinference-instrumentation-langchain==0.1.82",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "fakeredis==2.40.0"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:create_react_agent has been moved"]
